<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0c"/>
      <stop offset="100%" stop-color="#1c1c21"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="980" cy="120" r="360" fill="url(#glow)"/>

  <!-- Three cubes logo: W 9 Y (each cube 100x100) -->
  <g transform="translate(96, 200)">
    <rect x="0"   y="0" width="100" height="100" rx="20" fill="#7c3aed"/>
    <rect x="130" y="0" width="100" height="100" rx="20" fill="#7c3aed"/>
    <rect x="260" y="0" width="100" height="100" rx="20" fill="#7c3aed"/>
    <text x="50"  y="50" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif,system-ui,sans-serif" font-size="64" font-weight="700" fill="#ffffff">W</text>
    <text x="180" y="50" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif,system-ui,sans-serif" font-size="64" font-weight="700" fill="#ffffff">9</text>
    <text x="310" y="50" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif,system-ui,sans-serif" font-size="64" font-weight="700" fill="#ffffff">Y</text>
  </g>

  <!-- Wordmark + tagline -->
  <text x="96" y="400" font-family="ui-sans-serif,system-ui,sans-serif" font-size="64" font-weight="700" fill="#f4f4f5" letter-spacing="-1.5">W9Y</text>
  <text x="96" y="460" font-family="ui-sans-serif,system-ui,sans-serif" font-size="28" font-weight="400" fill="#a1a1aa">Host, build, and serve WebAssembly from any Go module.</text>

  <!-- Bottom row -->
  <text x="96"  y="560" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22" fill="#71717a">$ curl -o app.wasm w9y.io/go/&#8230;</text>
  <text x="1104" y="560" text-anchor="end" font-family="ui-sans-serif,system-ui,sans-serif" font-size="22" font-weight="500" fill="#71717a">w9y.io</text>
</svg>
